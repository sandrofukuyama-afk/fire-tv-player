plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Assinatura fixa vinda dos segredos do GitHub: permite instalar atualizações por cima sem perder o pareamento.
// Sem ela (build local), o APK de release usa a assinatura de teste.
def releaseKeystore = System.getenv("SIGNING_KEYSTORE_PATH")
def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.antigravity.signage'
    compileSdk 33

    defaultConfig {
        applicationId "com.antigravity.signage"
        minSdk 21
        targetSdk 33
        versionCode buildNumber
        versionName "2.0.$buildNumber"
    }

    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // Supabase / HTTP
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
}
